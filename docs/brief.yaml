# At-a-glance brief (rule R22). Edit here only; `python scripts/brief.py` writes it into README.md and the pages.
repo_url: https://github.com/sabrinapribadi/multimodal-damage-assessment
brief:
  - w: What
    lines:
      - A deep-learning model that rates building damage from satellite images after earthquakes, fusing optical and radar (SAR) images.
  - w: Why
    lines:
      - Responders need damage maps within hours, but clouds, smoke and night block optical images; radar sees through them.
  - w: Who
    lines:
      - "Users: disaster responders and damage analysts."
      - "Data: the public BRIGHT dataset (Hugging Face): pre-event optical and post-event radar tiles, labelled intact, damaged or destroyed."
  - w: Where
    lines:
      - "[Dashboard](https://multimodal-damage-assessment-d3dyfacsb2zwiqhtgovrsb.streamlit.app/) on Streamlit Community Cloud, reading precomputed results (no model at runtime)."
  - w: When it fails
    lines:
      - "Gate set first: radar must add ≥ 5 points of macro F1. Never met in six phases; best +2.2 points; adding Morocco gave −9.6."
      - "No live A/B test: an offline ablation scores the same tiles with and without radar on validation and test splits."
  - w: How
    lines:
      - ResNet-18 with an optical-gated radar branch and a Lovász loss, against an optical-only twin on identical tiles.
      - "Result: macro F1 0.580 vs 0.558 on validation, but optical-only wins on test (0.512 vs 0.454); macro F1 averages the three damage classes."
skills:
  - group: Computer vision
    what: ResNet-18 backbone, gated two-image fusion, Lovász-Softmax loss
    proof: [["baseline_model.py", "src/models/baseline_model.py"], ["ADR-005", "docs/adr/ADR-005-encoder-architecture.md"]]
  - group: Remote sensing
    what: optical and SAR tiles, tile labels from building footprints
    proof: [["ADR-002", "docs/adr/ADR-002-tile-label-derivation.md"], ["ADR-004", "docs/adr/ADR-004-backbone-and-sar-adaptation.md"]]
  - group: Data engineering
    what: selective download from a 13 GB zip with HTTP range requests
    proof: [["download_events.py", "scripts/download_events.py"]]
  - group: Experiment design
    what: pre-registered ablation gate, negative results reported phase by phase
    proof: [["ADR-001", "docs/adr/ADR-001-task-framing.md"], ["ADR-003", "docs/adr/ADR-003-validation-strategy.md"]]
  - group: MLOps and CI
    what: precomputed results for a free dashboard; CI on every push
    proof: [["ADR-006", "docs/adr/ADR-006-deployment-and-output.md"], ["ci.yml", ".github/workflows/ci.yml"]]
